name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r runtime/requirements.txt
      - run: python -m PyInstaller --onefile --collect-all pyatv --name atvremote runtime/atvremote_entry.py --distpath runtime/bin --workpath runtime/.build --specpath runtime/.build
      - run: npm install --package-lock=false
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Watching-Now-on-AppleTV-Windows
          path: dist/*.exe
      - name: Publish beta release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: ${{ github.ref_name }}
          body: |
            ## Watching Now on AppleTV ${{ github.ref_name }}

            Public beta for Windows.

            ### Changes
            - Fixed Electron desktop startup.
            - Added system tray support and minimize-to-tray behavior.
            - Added a custom application, tray, Start menu and Desktop shortcut icon.
            - Fixed duplicate Apple TV entries after pairing.
            - Stopped unnecessary VLC WebSocket reconnect attempts in normal Apple TV mode.

            ### Requirements
            - Windows 10/11
            - Apple TV and PC on the same local network
            - Discord Desktop running

            This is beta software. Playback information depends on what the active tvOS app exposes through Now Playing.

            Developed by **benesch.dev**
          files: dist/*.exe
