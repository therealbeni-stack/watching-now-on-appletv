name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r runtime/requirements.txt
      - run: python -m PyInstaller --onefile --collect-all pyatv --name atvremote runtime/atvremote_entry.py --distpath runtime/bin --workpath runtime/.build --specpath runtime/.build
      - run: npm install --package-lock=false
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Watching-Now-on-AppleTV-Windows
          path: dist/*.exe
      - name: Publish beta release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*.exe
